# Configuración central - local-gestion-gastos
# Esta archivo concentra toda la configuración del sistema, desde el tipo de
# base de datos hasta el modo de operación y los bancos activos.

# --- Configuración de Base de Datos ---
bd:
  tipo: "sqlite"
  ruta_sqlite: "./local_gastos.db"

# --- Modo de Operación ---
modo_operacion: "automate_broker"

# --- Ventana de Consolidación ---
ventana_consolidacion:
  minutos: 5

# --- Procesamiento ---
procesamiento:
  tiempo_espera_gps_segundos: 10
  tiempo_espera_dialogo_segundos: 30
  maximo_intentos_sincronizacion: 3
  backoff_espera_segundos: [5, 10, 30]

# --- Adaptadores Activos ---
adaptadores_activos:
  - "yape"
  - "ibk"

# --- Mapeo de Paquetes a Adaptadores ---
mapeo_adaptadores:
  pe.com.interbank.mobilebanking: "ibk"
  com.bcp.innovacxion.yapeapp: "yape"

# --- Directorio de Archivos Automate ---
directorio_archivos_automate: "/sdcard/storage/shared/Documents/noti.json"

# --- Configuración de Registro ---
# --- Configuración de Termux ---
# Ruta donde residen los binarios de Termux (en Termux real: /data/data/com.termux/files/usr/bin)
termux:
  path: "/data/data/com.termux/files/usr/bin"

logging:
  nivel: "INFO"
  archivo: "./logs/app.log"
  rotacion: "10 MB"
